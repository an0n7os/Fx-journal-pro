name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Frontend download budgets
        run: npm run check:frontend

      # Each suite gets a fresh temporary database and server. No live keys
      # are inherited; test billing is enabled only in the Pro unlock suite.
      - name: Isolated API and security regression tests
        run: npm run test:audit
