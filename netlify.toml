[build]
  command = "npm run netlify-build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  NODE_ENV = "production"

[functions]
  # Bundled rather than copied from node_modules, so the function ships only
  # what it reaches. This mattered most when metaapi.cloud-sdk was a
  # dependency and was 45MB on its own; that is gone now, and the bundle is
  # smaller again, but tree-shaking is still the right default here.
  node_bundler = "esbuild"

# The API. The splat is kept in the target so req.path still starts with /api
# and the routes in server.ts match unchanged.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves the built index.html so client-side
# routes such as /dashboard survive a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
