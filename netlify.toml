[build]
  command = "npm run netlify-build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Applies to the BUILD only. Variables declared here do not reach the
  # function runtime, so server.ts must not depend on NODE_ENV to know it is
  # in production — it uses IS_SERVERLESS for that. Set NODE_ENV=production in
  # the site's own environment variables as well if you want both to agree.
  NODE_ENV = "production"

[functions]
  # Bundled rather than copied from node_modules. metaapi.cloud-sdk alone is
  # 45MB on disk; esbuild tree-shakes the whole function to 12MB, 2.2MB zipped,
  # well inside Netlify's 50MB limit. Measured, not assumed.
  node_bundler = "esbuild"

# The API. The splat is kept in the target so req.path still starts with /api
# and the routes in server.ts match unchanged.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves the built index.html so client-side
# routes such as /dashboard survive a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
